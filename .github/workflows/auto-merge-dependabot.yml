name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, dev]

permissions:
  pull-requests: read

jobs:
  fetch-metadata:
    name: Fetch Dependabot metadata
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    name: Auto-merge Dependabot
    runs-on: ubuntu-latest
    needs: fetch-metadata
    if: |
      github.actor == 'dependabot[bot]' &&
      (needs.fetch-metadata.outputs.update-type == 'version-update:semver-patch' ||
       needs.fetch-metadata.outputs.update-type == 'version-update:semver-minor')
    permissions:
      pull-requests: write
    steps:
      - name: Auto-merge Dependabot PR
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPOSITORY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
